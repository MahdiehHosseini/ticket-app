<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>آفلاین | Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #eceffb;
        color: #16164a;
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      h1 {
        font-size: 1.4rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0.25rem 0;
        color: #8083a3;
      }
      button {
        margin-top: 1.25rem;
        border: 0;
        border-radius: 999px;
        background: #f4155a;
        color: #fff;
        font-weight: 700;
        padding: 12px 28px;
        font-size: 1rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>اینترنت وصل نیست</h1>
      <p>برای انتخاب صندلی و پرداخت، اتصال اینترنت لازم است.</p>
      <p dir="ltr">You're offline. Seat selection and payment need a connection.</p>
      <button onclick="location.reload()">تلاش دوباره / Retry</button>
    </main>
  </body>
</html>
